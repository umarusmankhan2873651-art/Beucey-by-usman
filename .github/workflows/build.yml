name: Build Firmware from 7z

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install p7zip-full
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # 1. Extract and locate the project
      - name: Extract and locate source
        id: locate_source
        run: |
          mkdir extracted
          7z x brucey.7z -oextracted -y
          
          PIO_DIR=$(find extracted -name "platformio.ini" -exec dirname {} \; | head -1)
          
          if [ -z "$PIO_DIR" ]; then
            echo "::error::Could not find platformio.ini inside the extracted files!"
            exit 1
          fi
          
          echo "PROJECT_DIR=$PIO_DIR" >> $GITHUB_ENV

      # 2. Fix Linux Case-Sensitivity (Explorer.h)
      - name: Fix Explorer.h case sensitivity
        run: |
          cd $PROJECT_DIR
          echo "Fixing include paths for Linux compatibility..."
          find src -type f \( -name "*.cpp" -o -name "*.h" \) -exec sed -i 's/#include "Explorer\.h"/#include "explorer.h"/g' {} +
          
          if [ -f "src/Explorer.h" ] && [ ! -f "src/explorer.h" ]; then
            mv src/Explorer.h src/explorer.h
          fi

      # 3. Expand partition table to fit the 2.05MB code
      - name: Expand partition table for larger firmware
        run: |
          cd $PROJECT_DIR
          cat << 'EOF' > partitions_ota.csv
          # Name,   Type, SubType, Offset,   Size,     Flags
          nvs,      data, nvs,     0x9000,   0x5000,
          otadata,  data, ota,     0xe000,   0x2000,
          app0,     app,  ota_0,   0x10000,  0x300000,
          app1,     app,  ota_1,   0x310000, 0x300000,
          spiffs,   data, spiffs,  0x610000, 0x200000,
          coredump, data, coredump,0x810000, 0x10000,
          EOF

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('brucey.7z') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO + esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      # 4. Compile
      - name: Build firmware
        run: |
          cd $PROJECT_DIR
          pio run -e BRUCEY_S3_SSD1306

      # 5. Merge into single flashable image
      - name: Create merged full-flash image
        run: |
          cd $PROJECT_DIR
          BUILD_DIR=".pio/build/BRUCEY_S3_SSD1306"
          
          for f in bootloader.bin partitions.bin firmware.bin; do
            if [ ! -f "$BUILD_DIR/$f" ]; then
              echo "::error::Missing required file: $BUILD_DIR/$f"
              exit 1
            fi
          done

          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin 2>/dev/null | head -1)

          python -m esptool --chip esp32s3 merge_bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0     "$BUILD_DIR/bootloader.bin" \
            0x8000  "$BUILD_DIR/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin" \
            -o      "$BUILD_DIR/merged_full_flash.bin"

      # 6. Collect artifacts
      - name: Collect artifacts
        run: |
          cd $PROJECT_DIR
          BUILD_DIR=".pio/build/BRUCEY_S3_SSD1306"
          mkdir -p ../artifacts
          
          cp "$BUILD_DIR/bootloader.bin"            ../artifacts/
          cp "$BUILD_DIR/partitions.bin"            ../artifacts/
          cp "$BOOT_APP0"                           ../artifacts/boot_app0.bin
          cp "$BUILD_DIR/firmware.bin"              ../artifacts/
          cp "$BUILD_DIR/merged_full_flash.bin"     ../artifacts/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP-HACK-BRUCEY-S3-Firmware
          path: artifacts/
          if-no-files-found: error
