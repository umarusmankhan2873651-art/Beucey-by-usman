name: Build Firmware from 7z

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install 7-Zip to extract the archive
      - name: Install p7zip-full
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      # 3. Extract brucey.7z and locate the platformio.ini
      - name: Extract and locate source
        id: locate_source
        run: |
          mkdir extracted
          7z x brucey.7z -oextracted -y
          
          # Find where platformio.ini is located inside the extracted folder
          PIO_DIR=$(find extracted -name "platformio.ini" -exec dirname {} \; | head -1)
          
          if [ -z "$PIO_DIR" ]; then
            echo "::error::Could not find platformio.ini inside the extracted files!"
            exit 1
          fi
          
          echo "Found project root at: $PIO_DIR"
          echo "PROJECT_DIR=$PIO_DIR" >> $GITHUB_ENV

      # 4. Cache PlatformIO to make future builds much faster
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('brucey.7z') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      # 5. Setup Python and install PlatformIO
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO + esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio esptool

      # 6. Compile the code
      - name: Build firmware
        run: |
          cd $PROJECT_DIR
          pio run -e BRUCEY_S3_SSD1306

      # 7. Merge bootloader, partitions, and firmware into one file
      - name: Create merged full-flash image
        run: |
          cd $PROJECT_DIR
          BUILD_DIR=".pio/build/BRUCEY_S3_SSD1306"
          
          # Verify required files exist
          for f in bootloader.bin partitions.bin firmware.bin; do
            if [ ! -f "$BUILD_DIR/$f" ]; then
              echo "::error::Missing required file: $BUILD_DIR/$f"
              exit 1
            fi
          done

          # Find boot_app0.bin
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin 2>/dev/null | head -1)

          # Merge
          python -m esptool --chip esp32s3 merge_bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0     "$BUILD_DIR/bootloader.bin" \
            0x8000  "$BUILD_DIR/partitions.bin" \
            0xe000  "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin" \
            -o      "$BUILD_DIR/merged_full_flash.bin"

      # 8. Collect files for download
      - name: Collect artifacts
        run: |
          cd $PROJECT_DIR
          BUILD_DIR=".pio/build/BRUCEY_S3_SSD1306"
          mkdir -p ../artifacts
          
          cp "$BUILD_DIR/bootloader.bin"            ../artifacts/
          cp "$BUILD_DIR/partitions.bin"            ../artifacts/
          cp "$BOOT_APP0"                           ../artifacts/boot_app0.bin
          cp "$BUILD_DIR/firmware.bin"              ../artifacts/
          cp "$BUILD_DIR/merged_full_flash.bin"     ../artifacts/
          
          ls -la ../artifacts/

      # 9. Upload the ZIP so you can download it
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP-HACK-BRUCEY-S3-Firmware
          path: artifacts/
          if-no-files-found: error
